<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#f3f1e9">
  <title>Страница не найдена — ПЕНКА</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <style>
    :root{color-scheme:light;--ivory:#f3f1e9;--green:#183a32;--gold:#b69a62;--ink:#202923}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ivory);color:var(--ink);font:16px/1.6 Manrope,Arial,sans-serif;text-align:center}
    main{max-width:620px}
    .brand{font:600 22px/1 Georgia,serif;letter-spacing:.22em;color:var(--green)}
    .code{margin:38px 0 8px;font:500 clamp(88px,22vw,150px)/.9 Georgia,serif;color:var(--gold)}
    h1{margin:22px 0 12px;font:500 clamp(30px,7vw,48px)/1.08 Georgia,serif;color:var(--green)}
    p{margin:0 auto 28px;max-width:440px;color:#626b62}
    a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 25px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:700}
    a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <div class="brand">ПЕНКА</div>
    <div class="code" aria-hidden="true">404</div>
    <h1>Кажется, эта страница потерялась</h1>
    <p>Такой страницы нет или ссылка устарела. Вернитесь на главную страницу демонстрационного проекта PENKA.</p>
    <a href="./">На главную</a>
  </main>
</body>
</html>
