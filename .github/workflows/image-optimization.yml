name: PENKA image optimization

on:
  push:
    branches: [main]
    paths:
      - "img/**"
      - "tools/optimize_images.py"
      - "tools/generate_responsive_images.py"
      - ".github/workflows/image-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize-images:
    name: Optimize WebP assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preserve original images
        run: |
          mkdir -p /tmp/penka-originals
          cp img/*.webp /tmp/penka-originals/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install image optimizer
        run: python -m pip install --upgrade Pillow

      - name: Generate optimized WebP files
        run: |
          python tools/optimize_images.py --quality 78 --max-width 1800 --max-height 1800
          python tools/generate_responsive_images.py

      - name: Replace assets only when files are smaller
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source = Path("optimized/img")
          target = Path("img")
          changed = 0
          for optimized in source.glob("*.webp"):
              original = target / optimized.name
              if original.exists() and optimized.stat().st_size < original.stat().st_size:
                  shutil.copy2(optimized, original)
                  changed += 1
          print(f"Updated {changed} image(s) with smaller WebP files.")
          if changed == 0:
              print("No images were smaller; repository assets remain unchanged.")
          PY

      - name: Upload original image backup
        uses: actions/upload-artifact@v4
        with:
          name: penka-original-images
          path: /tmp/penka-originals/
          retention-days: 14

      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add img/*.webp img/responsive/*.webp
          if git diff --cached --quiet; then
            echo "No optimized image changes to commit."
            exit 0
          fi
          git commit -m "Optimize WebP image assets"
          git push
