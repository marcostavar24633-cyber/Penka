name: PENKA Lighthouse audit

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/*.html"
      - "**/*.css"
      - "**/*.js"
      - "img/**"
      - "robots.txt"
      - "sitemap.xml"
      - "README.md"
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lighthouse:
    name: Audit published site
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Allow GitHub Pages deployment to finish
        if: github.event_name == 'push'
        run: sleep 60
      - name: Run Lighthouse on GitHub Pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://marcostavar24633-cyber.github.io/Penka/
          uploadArtifacts: true
          temporaryPublicStorage: true
