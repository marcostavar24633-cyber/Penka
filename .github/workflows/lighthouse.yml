name: PENKA Lighthouse audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest audit when quality checks finish close together.
concurrency:
  group: penka-lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    name: Audit published site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Wait for GitHub Pages publication
        run: sleep 90
      - name: Run Lighthouse on GitHub Pages
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://marcostavar24633-cyber.github.io/Penka/
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: true
