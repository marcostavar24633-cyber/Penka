name: PENKA hero image quality test

on:
  push:
    branches: [main]
    paths:
      - "tools/test_hero_quality.py"
      - ".github/workflows/hero-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade Pillow numpy
      - name: Compare WebP quality candidates
        run: python tools/test_hero_quality.py
