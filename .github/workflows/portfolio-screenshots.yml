name: PENKA portfolio screenshots

on:
  push:
    branches: [main]
    paths-ignore:
      - "portfolio/screenshots/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    name: Capture published responsive layouts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright Chromium
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Verify GitHub Pages publication
        run: |
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --output /dev/null https://marcostavar24633-cyber.github.io/Penka/; then
              echo "Published PENKA site is reachable."
              exit 0
            fi
            echo "Waiting for GitHub Pages (attempt $attempt/12)..."
            sleep 5
          done
          echo "Published site did not become reachable in time."
          exit 1
      - name: Capture desktop, tablet and mobile screenshots
        run: python tools/capture_portfolio_screenshots.py
      - name: Commit portfolio screenshots to repository
        run: |
          mkdir -p portfolio/screenshots
          cp artifacts/portfolio/*.png portfolio/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portfolio/screenshots/
          if git diff --cached --quiet; then
            echo "Portfolio screenshots are already up to date."
          else
            git commit -m "docs: refresh responsive portfolio screenshots"
            git push
          fi
      - name: Upload portfolio screenshots
        uses: actions/upload-artifact@v4
        with:
          name: penka-portfolio-screenshots
          path: artifacts/portfolio/
          if-no-files-found: error
          retention-days: 30
